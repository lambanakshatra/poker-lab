name: Engine tests
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/app.js && node --check src/arena.js && node --check src/question-bank.js && node --check src/question-bank-batch-02.js && node --check src/question-bank-ui.js
      - run: npm test
